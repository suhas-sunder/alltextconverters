<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Page Not Found | AllTextConverters</title>
    <style>
      :root {
        color: #0f172a;
        background: #f9fbfd;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
      }
      main {
        width: min(100%, 48rem);
        padding: clamp(2rem, 6vw, 3rem);
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        box-shadow: 0 8px 24px rgb(15 23 42 / 8%);
      }
      .status {
        margin: 0;
        color: #64748b;
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0.75rem 0 0;
        font-size: clamp(2rem, 6vw, 2.5rem);
        line-height: 1.15;
      }
      .message {
        max-width: 36rem;
        margin: 1rem auto 0;
        color: #334155;
        line-height: 1.65;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 2rem;
      }
      a {
        min-height: 2.75rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1.25rem;
        color: #fff;
        background: #0f172a;
        border-radius: 0.75rem;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        background: #1e293b;
      }
      a:focus-visible {
        outline: 3px solid #38bdf8;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="status">404</p>
      <h1>Page not found</h1>
      <p class="message">
        The address may be misspelled, or the page may have moved. Continue to
        the homepage or open one of the most-used text tools.
      </p>
      <nav aria-label="Continue browsing">
        <a href="/">Homepage</a>
        <a href="/word-counter">Word Counter</a>
        <a href="/case-converter">Case Converter</a>
      </nav>
    </main>
  </body>
</html>
